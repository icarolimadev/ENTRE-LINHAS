<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C0B2D">
    <title>Início | Entre Linhas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="pagina-inicio">
    <main class="inicio" aria-labelledby="titulo-inicio">
        <header class="cabecalho-logo">
            <img class="logo" src="../../assets/logo/logo.png"
                alt="Núcleo de Gênero e Diversidade Sexual" width="64" height="64">
        </header>

        <section class="inicio__conteudo" aria-labelledby="titulo-inicio">
            <h1 class="titulo inicio__titulo" id="titulo-inicio">Olá, visitante!</h1>
            <p class="inicio__mensagem">Cinco histórias. Novas perspectivas.</p>

            <section class="inicio__card" aria-labelledby="titulo-jornada">
                <h2 class="titulo-card inicio__titulo-card" id="titulo-jornada">Sua jornada começa aqui</h2>
                <p class="inicio__descricao">Explore situações do cotidiano e reflita sobre o impacto de cada escolha.</p>
            </section>

            <!-- O motor inicia ou retoma a rodada salva. -->
            <div class="inicio__acoes">
                <button type="button" data-acao="iniciar-jornada" disabled>Jogar agora <span aria-hidden="true">→</span></button>
                <button type="button" data-rota="comoFuciona">Como funciona<span aria-hidden="true">→</span></button>
                <button type="button" data-rota="creditos">Créditos</button>
            </div>
        </section>

        <footer class="rodape" aria-hidden="true">
            <img class="rodape__ondas" src="../../assets/illustrations/rodapé.png"
                alt="" width="402" height="100">
        </footer>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
