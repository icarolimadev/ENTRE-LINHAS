<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configuração para textos em português e telas de celular. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C0B2D">
    <meta name="description" content="Entre Linhas: escolhas, perspectivas e reflexão.">
    <title>Boas-vindas | Entre Linhas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="pagina-boas-vindas">
    <!-- A tela cresce com o conteúdo para não cortar textos em celulares menores. -->
    <main class="boas-vindas" aria-labelledby="titulo-boas-vindas">
        <!-- Marca do núcleo, alinhada ao lado direito como na referência. -->
        <header class="cabecalho-logo">
            <img class="logo" src="../../assets/logo/logo.png"
                alt="Núcleo de Gênero e Diversidade Sexual" width="64" height="64">
        </header>

        <!-- Conteúdo principal com largura limitada para manter a leitura confortável. -->
        <section class="boas-vindas__conteudo" aria-labelledby="titulo-boas-vindas">
            <h1 class="boas-vindas__titulo" id="titulo-boas-vindas">Toda escolha abre<br>uma nova perspectiva.</h1>

            <img class="boas-vindas__ilustracao" src="../../assets/illustrations/galera.png"
                alt="Grupo de cinco jovens reunidos com uma bandeira do arco-íris."
                width="308" height="265" fetchpriority="high">

            <h2 class="boas-vindas__nome">ENTRE LINHAS</h2>
            <p class="boas-vindas__mensagem">Escolhas • Perspectivas • Reflexão</p>

            <!-- O nome da rota é resolvido pelo módulo de navegação. -->
            <a class="botao" data-rota="identificacao" href="identificação.html">
                Começar <span aria-hidden="true">→</span>
            </a>
        </section>

        <!-- Ilustração decorativa; o rodapé acompanha o conteúdo sem sobrepor o botão. -->
        <footer class="rodape" aria-hidden="true">
            <img class="rodape__ondas" src="../../assets/illustrations/rodapé.png" alt="" width="402" height="100">
        </footer>
    </main>
    <script type="module" src="../js/navigation/navigation.js"></script>
</body>
</html>
