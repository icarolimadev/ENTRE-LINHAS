<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C0B2D">
    <title>Jornada concluída | Entre Linhas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="pagina-conclusao">
    <main class="conclusao" aria-labelledby="titulo-conclusao">
        <header class="cabecalho-logo">
            <img class="logo" src="../../assets/logo/logo.png"
                alt="Núcleo de Gênero e Diversidade Sexual" width="64" height="64">
        </header>
        <section class="conclusao__conteudo" data-historia-conteudo hidden aria-labelledby="titulo-conclusao">
            <h1 class="titulo conclusao__titulo" id="titulo-conclusao">A reflexão continua fora da tela.</h1>
            <section class="conclusao__card" aria-labelledby="titulo-jornada-concluida">
                <h2 class="titulo-card conclusao__titulo-card" id="titulo-jornada-concluida">Você percorreu as 5 histórias</h2>
                <p class="conclusao__descricao">Escutar, respeitar e acolher são escolhas que podemos praticar todos os dias.</p>
            </section>
            <h2 class="conclusao__pergunta">Que atitude você quer levar para sua convivência?</h2>
            <!-- Uma nova rodada preserva o apelido e sorteia outra ordem. -->
            <div class="conclusao__acoes">
                <button type="button" data-acao="jogar-novamente">Jogar novamente</button>
                <button type="button" data-acao="voltar-inicio">Voltar ao início</button>
            </div>
        </section>
        <footer class="rodape" aria-hidden="true">
            <img class="rodape__ondas" src="../../assets/illustrations/rodapé.png"
                alt="" width="402" height="100">
        </footer>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
