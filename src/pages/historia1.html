<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C0B2D">
    <title>Além das aparências | Entre Linhas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="pagina-historia" data-tela-historia="historia" data-historia-id="historia-1">
    <main class="historia" aria-labelledby="titulo-historia">
        <header class="cabecalho-logo">
            <img class="logo" src="../../assets/logo/logo.png"
                alt="Núcleo de Gênero e Diversidade Sexual" width="64" height="64">
        </header>

        <p class="historia__conteudo" data-historia-aviso role="status">Carregando história…</p>
        <section class="historia__conteudo" data-historia-conteudo hidden aria-labelledby="titulo-historia">
            <div class="historia__progresso">
                <p class="legenda historia__etapa"></p>
                <span aria-hidden="true">·</span>
                <span class="historia__marcadores" aria-hidden="true">
                </span>
            </div>

            <h1 class="titulo historia__titulo" id="titulo-historia"></h1>

            <section class="historia__card" aria-labelledby="titulo-pergunta">
                <h2 class="titulo-card historia__titulo-card" id="titulo-pergunta">O que você faria?</h2>
                <p class="historia__descricao"></p>
            </section>

            <!-- Alternativas e seleção são controladas pelo motor da jornada. -->
            <div class="historia__opcoes" role="group" aria-labelledby="titulo-pergunta" aria-describedby="orientacao-historia">
            </div>

            <p class="legenda historia__orientacao" id="orientacao-historia">Toque em uma opção para refletir.</p>
        </section>

        <footer class="rodape" aria-hidden="true">
            <img class="rodape__ondas" src="../../assets/illustrations/rodapé.png"
                alt="" width="402" height="100">
        </footer>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
