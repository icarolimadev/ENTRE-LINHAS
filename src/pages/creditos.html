<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1C0B2D">
    <title>Créditos | Entre Linhas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="pagina-creditos">
    <main class="creditos" aria-labelledby="titulo-creditos">
        <header class="cabecalho-logo">
            <img class="logo" src="../../assets/logo/logo.png"
                alt="Núcleo de Gênero e Diversidade Sexual" width="64" height="64">
        </header>

        <section class="creditos__conteudo" aria-labelledby="titulo-creditos">
            <h1 class="titulo creditos__titulo" id="titulo-creditos">Construído com respeito</h1>

            <div class="creditos__cards">
                <section class="creditos__card" aria-labelledby="titulo-nugeds">
                    <h2 class="titulo-card creditos__titulo-card" id="titulo-nugeds">NUGEDS</h2>
                    <p class="creditos__descricao">Núcleo de Gênero e Diversidade Sexual do IFCE.</p>
                </section>

                <section class="creditos__card" aria-labelledby="titulo-entre-linhas">
                    <h2 class="titulo-card creditos__titulo-card" id="titulo-entre-linhas">Entre Linhas</h2>
                    <p class="creditos__descricao">Protótipo educativo sobre diversidade, empatia e convivência. Roteiros demonstrativos para revisão pedagógica.</p>
                </section>
            </div>

            <!-- A navegação deste botão será adicionada posteriormente. -->
            <button type="button" data-rota="inicio" >Voltar ao início</button>
        </section>

        <footer class="rodape" aria-hidden="true">
            <img class="rodape__ondas" src="../../assets/illustrations/rodapé.png"
                alt="" width="402" height="100">
        </footer>
    </main>
    <script type="module" src="../js/navigation/navigation.js"></script>
</body>
</html>
